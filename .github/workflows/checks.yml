name: Synthetic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 checks/backend_checks.py
      - run: python3 -m pip install PyYAML
      - run: python3 checks/provider_checks.py
      - run: python3 checks/installer_checks.py
      - run: npm ci --ignore-scripts
      - run: npm run check
